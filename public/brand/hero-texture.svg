<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" preserveAspectRatio="xMinYMid slice">
  <!-- Fine, low-contrast watercolor mottling in the site's periwinkle, for behind the homepage headline.
       The bottom fades back to plain periwinkle so it blends into the rest of the hero. -->
  <defs>
    <!-- light pigment blooms -->
    <filter id="light" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="6" seed="21" />
      <feColorMatrix values="0 0 0 0 .80  0 0 0 0 .81  0 0 0 0 .99  2.4 0 0 0 -1.1" />
      <feComponentTransfer><feFuncA type="table" tableValues="0 .05 .16 .2 .22" /></feComponentTransfer>
    </filter>
    <!-- deeper pigment pooling -->
    <filter id="deep" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".014" numOctaves="6" seed="8" />
      <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .44  0 0 0 0 .86  0 2.4 0 0 -1.1" />
      <feComponentTransfer><feFuncA type="table" tableValues="0 .04 .13 .17 .18" /></feComponentTransfer>
    </filter>
    <!-- faint tide lines where washes dried -->
    <filter id="tide" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="6" seed="21" />
      <feColorMatrix values="0 0 0 0 .38  0 0 0 0 .38  0 0 0 0 .8  1 0 0 0 0" />
      <feComponentTransfer><feFuncA type="table" tableValues="0 0 0 0 0 0 0 0 0 .07 0 0 0 0 0 .06 0 0 0 0" /></feComponentTransfer>
      <feGaussianBlur stdDeviation=".6" />
    </filter>
    <!-- paper grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="3" />
      <feColorMatrix values="0 0 0 0 .2  0 0 0 0 .2  0 0 0 0 .45  0 0 0 .1 0" />
    </filter>
    <linearGradient id="settle" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".7" stop-color="#9a9df7" stop-opacity="0" />
      <stop offset="1" stop-color="#9a9df7" />
    </linearGradient>
  </defs>

  <rect width="1440" height="680" fill="#9a9df7" />
  <rect width="1440" height="680" filter="url(#light)" />
  <rect width="1440" height="680" filter="url(#deep)" />
  <rect width="1440" height="680" filter="url(#tide)" />
  <rect width="1440" height="680" filter="url(#grain)" />
  <rect width="1440" height="680" fill="url(#settle)" />
</svg>
