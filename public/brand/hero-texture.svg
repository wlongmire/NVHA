<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" preserveAspectRatio="xMinYMid slice">
  <!-- Watercolor wash in the site's periwinkle family with gold-leaf veins. Sits behind the homepage headline;
       the bottom edge fades back to plain periwinkle so it blends into the rest of the hero. -->
  <defs>
    <!-- ragged pigment edge -->
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".005 .008" numOctaves="5" seed="4" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="120" xChannelSelector="R" yChannelSelector="G" result="d" />
      <feGaussianBlur in="d" stdDeviation="2" result="body" />
      <!-- pigment pools at the edge as it dries: keep what lies outside a blurred core -->
      <feGaussianBlur in="d" stdDeviation="22" result="core" />
      <feComposite in="d" in2="core" operator="out" result="rim" />
      <feGaussianBlur in="rim" stdDeviation="1.5" result="rimSoft" />
      <feMerge><feMergeNode in="body" /><feMergeNode in="rimSoft" /><feMergeNode in="rimSoft" /></feMerge>
    </filter>
    <!-- paper grain / granulation -->
    <filter id="grain" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="9" />
      <feColorMatrix values="0 0 0 0 .18  0 0 0 0 .16  0 0 0 0 .4  0 0 0 .14 0" />
    </filter>
    <!-- torn gold-leaf edge -->
    <filter id="leaf" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="2" seed="12" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="thread" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="turbulence" baseFrequency=".05" numOctaves="2" seed="5" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#9c6d22" />
      <stop offset=".18" stop-color="#e9c46a" />
      <stop offset=".34" stop-color="#b3862f" />
      <stop offset=".52" stop-color="#f4d98b" />
      <stop offset=".7" stop-color="#a97b2a" />
      <stop offset=".86" stop-color="#ecca74" />
      <stop offset="1" stop-color="#9c6d22" />
    </linearGradient>
    <linearGradient id="settle" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".72" stop-color="#9a9df7" stop-opacity="0" />
      <stop offset="1" stop-color="#9a9df7" />
    </linearGradient>
  </defs>

  <rect width="1440" height="680" fill="#9a9df7" />

  <g filter="url(#wash)">
    <!-- pale wash top left, behind the label and first line -->
    <path d="M-60 -60 C 260 -70 470 40 450 170 C 430 290 230 300 60 280 C -40 268 -90 160 -60 -60 Z" fill="#c3c5fc" opacity=".7" />
    <!-- cool blue bloom drifting in from the top -->
    <path d="M380 -70 C 600 -60 760 20 730 130 C 700 230 560 220 470 150 C 400 95 330 20 380 -70 Z" fill="#8fb4f3" opacity=".42" />
    <!-- warm blush, a nod to the brand rose -->
    <path d="M-80 300 C 60 250 210 300 250 390 C 290 480 180 560 40 540 C -60 525 -110 420 -80 300 Z" fill="#d9a3c4" opacity=".38" />
    <!-- deep violet pooling low, under the paragraph -->
    <path d="M170 430 C 380 360 640 400 760 500 C 860 590 760 720 520 720 C 300 720 140 640 130 560 C 125 500 135 455 170 430 Z" fill="#6c6be0" opacity=".42" />
    <!-- lavender bloom, middle right (runs under the mural edge) -->
    <path d="M560 150 C 720 110 900 170 920 300 C 940 420 800 450 680 410 C 570 375 500 300 510 230 C 515 195 530 165 560 150 Z" fill="#b7a7f2" opacity=".5" />
    <!-- small pale bloom behind the headline -->
    <path d="M250 200 C 340 170 450 210 460 290 C 470 370 380 400 300 380 C 220 360 190 230 250 200 Z" fill="#d6d3fd" opacity=".4" />
  </g>

  <rect width="1440" height="680" filter="url(#grain)" />

  <!-- gold leaf: one bold vein low, under the buttons, rising toward the mural -->
  <g fill="none" stroke-linecap="round">
    <g filter="url(#leaf)">
      <path d="M-30 610 C 80 560 150 640 260 630 C 380 620 430 545 560 520 C 680 497 740 440 860 400" stroke="url(#gold)" stroke-width="11" />
      <path d="M-30 610 C 80 560 150 640 260 630 C 380 620 430 545 560 520 C 680 497 740 440 860 400" stroke="#fff4cc" stroke-width="2.4" opacity=".6" />
    </g>
    <!-- fine hand-drawn threads -->
    <g filter="url(#thread)" stroke="url(#gold)">
      <path d="M455 -10 C 470 60 430 110 470 170 C 500 215 480 260 520 300" stroke-width="1.6" />
      <path d="M-20 300 C 40 290 80 330 140 320 C 190 312 210 280 260 285" stroke-width="1.3" opacity=".85" />
    </g>
  </g>

  <rect width="1440" height="680" fill="url(#settle)" />
</svg>
