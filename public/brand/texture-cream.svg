<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- A fine linen weave on the homepage's cream panels: horizontal and vertical fibers crossing over each other.
       It tiles seamlessly, so it repeats at its own size instead of stretching with the section. -->
  <defs>
    <filter id="weft" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .55" numOctaves="2" seed="7" stitchTiles="stitch" />
      <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .32  1.6 0 0 0 -.62" />
      <feComponentTransfer><feFuncA type="table" tableValues="0 .035 .08 .12" /></feComponentTransfer>
    </filter>
    <filter id="warp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".55 .012" numOctaves="2" seed="19" stitchTiles="stitch" />
      <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .32  1.6 0 0 0 -.62" />
      <feComponentTransfer><feFuncA type="table" tableValues="0 .03 .07 .1" /></feComponentTransfer>
    </filter>
    <pattern id="cell" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 .5H4M.5 0V4" stroke="#8a7355" stroke-opacity=".035" stroke-width=".5" fill="none" />
    </pattern>
  </defs>
  <rect width="300" height="300" fill="#f6f2ea" />
  <rect width="300" height="300" filter="url(#weft)" />
  <rect width="300" height="300" filter="url(#warp)" />
  <rect width="300" height="300" fill="url(#cell)" />
</svg>
